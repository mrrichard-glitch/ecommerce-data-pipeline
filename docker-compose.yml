# One command brings up PostgreSQL, Airflow and (optionally) Metabase:
#   docker compose up -d                 # Postgres + Airflow
#   docker compose --profile bi up -d    # ...plus Metabase

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  WAREHOUSE_DSN: postgresql://warehouse:warehouse@postgres:5432/warehouse
  PIPELINE_DATA_DIR: /opt/airflow/data
  PIPELINE_SQL_DIR: /opt/airflow/sql
  PYTHONPATH: /opt/airflow

# All credentials in this file are for local demos only.
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  environment: *airflow-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # warehouse reachable from your machine on localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  # One-off: migrate the Airflow database and create the (demo-only) admin user.
  airflow-init:
    <<: *airflow-common
    # `|| true` lets a re-run skip an existing user; the last line fails the
    # init (and so the stack) if the admin user still does not exist.
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@example.com || true
        airflow users list | grep -qw admin

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"   # set AIRFLOW_PORT if 8080 is taken
    command: webserver

  # Its own service, so Docker restarts it if it dies.
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: scheduler

  metabase:
    image: metabase/metabase:v0.50.0
    profiles: ["bi"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
