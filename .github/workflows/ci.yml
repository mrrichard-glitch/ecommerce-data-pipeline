name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse" --health-interval 5s --health-retries 10
    env:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@localhost:5432/warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: pytest -v
      - name: Full week through the pipeline
        run: python -m pipeline.run --start 2026-10-01 --end 2026-10-07
